name: Deploy Dona y Viste to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DONA Y VISTE/package-lock.json
      - run: npm ci
        working-directory: DONA Y VISTE
      - run: npm run build
        working-directory: DONA Y VISTE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: DONA Y VISTE/dist
      - id: deployment
        uses: actions/deploy-pages@v4
